<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dex-Retargeting · ApexHand Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
  }
  .container { max-width: 960px; width: 100%; }
  header { text-align: center; margin-bottom: 36px; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
  .subtitle { color: #8b949e; margin-top: 10px; font-size: 1.05rem; }
  .video-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  video { display: block; width: 100%; height: auto; background: #000; }
  .caption {
    padding: 14px 18px;
    color: #8b949e;
    font-size: .92rem;
    border-top: 1px solid #30363d;
  }
  footer {
    margin-top: 40px;
    text-align: center;
    color: #6e7681;
    font-size: .85rem;
  }
  footer a { color: #58a6ff; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Dex-Retargeting · ApexHand</h1>
    <p class="subtitle">Human-hand motion retargeting to a dexterous robotic hand</p>
  </header>

  <div class="video-card">
    <video src="demo.mp4" controls autoplay muted loop playsinline></video>
    <div class="caption">Real-time retargeting demo — human hand motion mapped to the ApexHand dexterous hand.</div>
  </div>

  <footer>
    <p><a href="https://github.com/cusenzabibybh556-oss/dex-retargeting-demo#readme">Project description</a> · Source code available upon request</p>
  </footer>
</div>
</body>
</html>
